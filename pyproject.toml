[project]
name = "email-mcp-server"
version = "0.1.0"
description = "邮件 MCP 服务器：为外部 agent 提供 IMAP/SMTP 邮件工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "email-validator>=2.0",
    "python-dateutil>=2.9",
]

[project.scripts]
email-mcp = "email_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/email_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
